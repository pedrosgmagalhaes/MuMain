; Tema "taverna" -- identidade do servidor por cima do modern.
; Carregado por UI::RmlBridge (RmlTheme.cpp). Nenhuma recompilacao: o tema e uma pasta.
;
; Base=modern: herda todo o vocabulario estrutural do modern (.modern-frame, .btn, .checkbox-box,
; .text-field, .modern-content-well, ...) e o base.rcss dele. Este tema so sobrescreve
; tokens.ini (paleta/tipografia) e os dois arquivos da janela de login. Qualquer janela que
; este tema nao fork continua com o layout do modern, mas ja com a paleta da taverna, porque o
; modern referencia token() em vez de hex literal para cor de superficie/texto/borda.
[Theme]
Base=modern

; Fontes opcionais por arquivo (UI/RmlBridge/ThemeFonts.h). Uma chave = um arquivo. Arquivo
; ausente e ignorado em silencio; o token font-* cai para o valor do ancestral (Liberation Sans).
; Duas chaves para a MESMA familia de proposito: o Windows acha uma, o macOS acha a outra, e as
; duas resolvem para a familia "Georgia" que o tokens.ini pede.
[Fonts]
tavern-title-win=%WINDIR%\Fonts\georgia.ttf
tavern-title-win-bold=%WINDIR%\Fonts\georgiab.ttf
tavern-title-win-italic=%WINDIR%\Fonts\georgiai.ttf
tavern-title-mac=/System/Library/Fonts/Supplemental/Georgia.ttf
tavern-title-mac-bold=/System/Library/Fonts/Supplemental/Georgia Bold.ttf
tavern-title-mac-italic=/System/Library/Fonts/Supplemental/Georgia Italic.ttf

; Rotulo no dropdown de Opcoes -> UI -> Tema.
[Meta]
DisplayName=Taverna
