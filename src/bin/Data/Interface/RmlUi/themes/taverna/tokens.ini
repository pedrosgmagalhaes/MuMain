; Paleta da taverna -- mesa de madeira, latao e pergaminho.
;
; Resolvido por UI::RmlBridge::InlineTokenizedStylesheet() antes do RmlUi ler o .rcss: token(nome)
; vira substituicao de texto. Chaves de [Tokens] herdam individualmente do tema Base (modern),
; entao este arquivo sobrescreve so o que muda de cor/tipografia e o resto continua valendo.
;
; ATENCAO do motor: rgba() aqui e 0-255 no alfa, nao 0.0-1.0.
; Nomes mantidos identicos aos do modern de proposito: qualquer .rcss herdado que ja usa
; token(x) passa a pintar com a paleta da taverna sem ser tocado.
[Tokens]

; --- Superficies: madeira escura de taberna ---
surface-deep=#120b07
surface-backdrop=rgba(12, 7, 4, 170)
surface-recessed=#1a100a
surface-panel=#2a1a10
surface-raised=#3a2617
surface-control=rgba(255, 226, 178, 12)
surface-tooltip=rgba(18, 11, 7, 247)

; --- Metal: latao envelhecido em vez de ferro negro ---
metal-dark=#241708
metal-mid=#6b4a24
metal-edge=#9c7136
metal-highlight=#e0be7a
metal-warm-edge=#c08b3e
metal-outer=#150d06
metal-groove=#2a1b0e
metal-rail=#3d2814
metal-rail-dark=#1a1008
metal-title-face=#3a1f0c
metal-title-face-dark=#1d0f05

; --- Texto: pergaminho sobre madeira ---
text-primary=#f2e2c4
text-secondary=#cbb08a
text-muted=#95805f
text-warm=#e8c069
text-disabled=#5d4b36

; --- Acentos: latao (chrome interativo), vinho (acao primaria), ouro (selecionado) ---
accent-steel=#8a6a45
accent-steel-hover=#c9a468
accent-crimson=#8a2b22
accent-crimson-hover=#c9563f
accent-gold=#d0a44e
accent-gold-hover=#f2d68a

; --- Semanticas: mantidas reconheciveis (estado, nao decoracao) ---
semantic-success=#8fb06a
semantic-warning=#d9a53c
semantic-danger=#b33a2a
semantic-rare=#9a6bc0
semantic-neutral=#6f6455

; --- Bordas: latao visivel, veio interno, fio quase invisivel ---
border-frame=#6b4a26
border-inner=#3a2614
border-recessed=#2c1e11
border-hover=#b98b45
border-selected=#e2b757
border-outer=#1b120a
border-rail=#4a3218
border-title=#7a4a1e

; --- Raio: canto de tabua, levemente arredondado ---
radius-sm=2
radius-md=4

; --- Tipografia: titulo em serifa (Georgia do sistema), corpo sans para legibilidade no HUD ---
; font-body fica em Liberation Sans (embutida) de proposito: numero de HUD em serifa a 8dp nao le.
font-title=Georgia
font-body=Liberation Sans
; Nome novo deste tema, usado no letreiro do login: se a Georgia nao existir na maquina, o token
; cai para a familia do ancestral (Liberation Sans) e o tema continua legivel.
font-wordmark=Georgia

; --- Cores novas deste tema (nenhum .rcss herdado depende delas) ---
tavern-oak-light=#4a2f18
tavern-oak-grain=rgba(0, 0, 0, 46)
tavern-brass-hair=rgba(224, 190, 122, 90)
tavern-lantern-glow=rgba(255, 176, 74, 60)
tavern-parchment-ink=#2a1a10
tavern-carved-shadow=rgba(0, 0, 0, 150)

; --- Lista de servidores (Data/Local/ServerList.json le estas cores) ---
server-button=#d0a44e
server-button-gray=#6f6455
server-button-orange=#d9a53c
server-button-silver=#b9a789
server-load-base=#8fb06a
server-load-full=#b33a2a
server-load-empty=#0d0805

; resource-hp/-mp/-sd/-ag NAO sao sobrescritos: significam a barra de cada atributo, nao a
; estetica do tema. Herdados do modern.
